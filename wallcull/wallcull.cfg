# wallcull settings. Read at server start and re-read within ~5 s after
# this file changes, no restart needed. Distances in metres, times in seconds.

# Line of sight
near = 20           # enemies closer than this are always sent (footsteps)
hold = 1.5          # keep sending this long after the enemy was last visible
lead = 0.25         # predict enemy movement this far ahead (ping, re-ghost)
recheck = 0.2       # how often one viewer/enemy pair is re-tested

# Gunfire
shot_range = 150    # a firing enemy is sent within this distance
quiet_range = 40    # same, for suppressed weapons
shot_hold = 1.5     # keep sending this long after the last shot

# Load and logging
ray_budget = 40000  # rays per second; above it enemies count as visible
log = 60            # seconds between stats lines on stderr, 0 = off
